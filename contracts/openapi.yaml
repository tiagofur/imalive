openapi: 3.1.0
info:
  title: Tranqui API
  version: 0.1.0
  description: >
    Tranqui backend API (contract-first, ADR-0003). This contract is the
    negotiation point between backend, Android and iOS: endpoints are
    described here first, reviewed in PR, then implemented. Week 1 covers
    phone OTP auth, profile, contacts and manual check-in.
  contact:
    name: Tranqui factory
    url: https://github.com/tiagofur/imalive
servers:
  - url: https://api.tranqui.app/v1
    description: Production (placeholder domain until hosting ADR-0006).
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Phone OTP authentication and session refresh.
  - name: checkins
    description: Manual check-in signal and today's cycle status.
  - name: contacts
    description: Trusted circle (1-5 contacts depending on plan).
  - name: profile
    description: Authenticated user profile and check-in preferences.
# Paths for week 1 (issue #2): auth + profile in P2, contacts + checkins in P3.
paths:
  /auth/otp/request:
    post:
      operationId: requestOtp
      description: >
        Sends a one-time code to the phone via WhatsApp/SMS (Twilio Verify).
        Always returns 204 (even for unknown phones) to avoid account
        enumeration. Rate limited per phone/IP: 429 with Retry-After.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
            example:
              phone: '+5215512345678'
      responses:
        '204':
          description: Code sent (or already recently sent).
        '400':
          description: Invalid phone format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.tranqui.app/problems/phone-invalid
                title: Invalid phone number
                status: 400
                detail: Phone must be E.164, e.g. +5215512345678.
                code: PHONE_INVALID
                instance: /v1/auth/otp/request
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/otp/verify:
    post:
      operationId: verifyOtp
      description: >
        Verifies the OTP code and issues the session token pair. No PII in
        the response: the client reads the profile with GET /me.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
            example:
              phone: '+5215512345678'
              code: '482913'
      responses:
        '200':
          description: Code verified; session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
                refreshToken: 7f3a9c2e5b1d4a6f8e0c3b5d7a9e1f2a4
                expiresInSeconds: 900
        '400':
          description: Wrong or expired code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalid:
                  summary: Wrong code.
                  value:
                    type: https://api.tranqui.app/problems/otp-invalid
                    title: Invalid code
                    status: 400
                    detail: The code does not match or has too many attempts.
                    code: OTP_INVALID
                    instance: /v1/auth/otp/verify
                expired:
                  summary: Code expired.
                  value:
                    type: https://api.tranqui.app/problems/otp-expired
                    title: Code expired
                    status: 400
                    detail: The code expired; request a new one.
                    code: OTP_EXPIRED
                    instance: /v1/auth/otp/verify
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      operationId: refreshSession
      description: >
        Rotates the session token pair using a valid refresh token.
        Completes the 15-minute JWT session: without it the session would
        die after 15 minutes.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: 7f3a9c2e5b1d4a6f8e0c3b5d7a9e1f2a4
      responses:
        '200':
          description: Session rotated; new token pair issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
                refreshToken: 9e1f2a4b6c8d0e2f4a6b8c0d2e4f6a8b0
                expiresInSeconds: 900
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    get:
      operationId: getProfile
      description: >
        Returns the authenticated user's profile: name, phone and
        check-in preferences. The full escalation ladder lives in
        PUT /escalation-policy (week 2); only the grace window is here.
      tags: [profile]
      responses:
        '200':
          description: Current profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                id: 01934f2e-7a1b-7c3d-9e4f-1a2b3c4d5e6f
                name: Ana
                phone: '+5215512345678'
                checkinTime: '21:00'
                timezone: America/Mexico_City
                escalationWindowMinutes: 60
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateProfile
      description: >
        Partially updates the profile (name, check-in time, timezone,
        grace window). Omitted fields keep their values.
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
            example:
              checkinTime: '22:00'
              escalationWindowMinutes: 90
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                id: 01934f2e-7a1b-7c3d-9e4f-1a2b3c4d5e6f
                name: Ana
                phone: '+5215512345678'
                checkinTime: '22:00'
                timezone: America/Mexico_City
                escalationWindowMinutes: 90
        '400':
          description: Invalid field value.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.tranqui.app/problems/validation-failed
                title: Validation failed
                status: 400
                detail: checkinTime must be HH:MM in 24h format.
                code: VALIDATION_FAILED
                instance: /v1/me
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Short-lived access JWT (15 min). Only the auth endpoints are
        public (`security: []`); everything else requires this scheme.
  schemas:
    Problem:
      description: >
        RFC 9457 problem details with a stable business `code` consumed by
        the apps for copy and decisions (api-guidelines).
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: Stable URI identifying the problem kind.
          example: https://api.tranqui.app/problems/contact-limit-reached
        title:
          type: string
          description: Short human-readable summary.
          example: Límite de contactos alcanzado
        status:
          type: integer
          description: HTTP status code of the response.
          example: 422
        detail:
          type: string
          description: Specific explanation of this occurrence.
          example: El plan gratuito permite hasta 1 contacto.
        code:
          type: string
          description: Stable business code (what the apps switch on).
          example: CONTACT_LIMIT_REACHED
        instance:
          type: string
          format: uri-reference
          description: URI of this specific occurrence.
          example: /v1/contacts
    PhoneNumber:
      description: Phone in E.164 format (e.g. +5215512345678).
      type: string
      pattern: '^\+[1-9]\d{7,14}$'
      example: '+5215512345678'
    OtpRequest:
      description: Request an OTP code for the phone.
      type: object
      required: [phone]
      properties:
        phone:
          $ref: '#/components/schemas/PhoneNumber'
    OtpVerify:
      description: Verify the OTP code received by WhatsApp/SMS.
      type: object
      required: [phone, code]
      properties:
        phone:
          $ref: '#/components/schemas/PhoneNumber'
        code:
          type: string
          description: 6-digit code from Twilio Verify.
          pattern: '^\d{6}$'
          example: '482913'
    Tokens:
      description: 'Session token pair. No PII: profile comes from GET /me.'
      type: object
      required: [accessToken, refreshToken, expiresInSeconds]
      properties:
        accessToken:
          type: string
          description: Short-lived JWT (15 min) for the Authorization header.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
        refreshToken:
          type: string
          description: Opaque token to rotate the session.
          example: 7f3a9c2e5b1d4a6f8e0c3b5d7a9e1f2a4
        expiresInSeconds:
          type: integer
          description: Access token lifetime in seconds (900 = 15 min).
          example: 900
    RefreshRequest:
      description: Rotate the session with a valid refresh token.
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: Valid refresh token from a previous issue/rotation.
          example: 7f3a9c2e5b1d4a6f8e0c3b5d7a9e1f2a4
    UserProfile:
      description: >
        Authenticated user profile (R-02). Minimum data: no email,
        address, notes or avatar. The full ladder is week 2.
      type: object
      required: [id, name, phone, checkinTime, timezone, escalationWindowMinutes]
      properties:
        id:
          type: string
          format: uuid
          description: User id (UUID v7).
          example: 01934f2e-7a1b-7c3d-9e4f-1a2b3c4d5e6f
        name:
          type: string
          description: Display name.
          minLength: 1
          maxLength: 80
          example: Ana
        phone:
          $ref: '#/components/schemas/PhoneNumber'
        checkinTime:
          type: string
          description: Daily check-in time (HH:MM, 24h) in the user timezone.
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '21:00'
        timezone:
          type: string
          description: IANA timezone; the engine requires it explicit.
          example: America/Mexico_City
        escalationWindowMinutes:
          type: integer
          description: Grace window in minutes before escalation (default 60).
          minimum: 0
          maximum: 1440
          default: 60
          example: 60
    ProfilePatch:
      description: Partial profile update; omitted fields keep their values.
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Ana
        checkinTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '22:00'
        timezone:
          type: string
          example: America/Mexico_City
        escalationWindowMinutes:
          type: integer
          minimum: 0
          maximum: 1440
          example: 90
  responses:
    Unauthorized:
      description: Missing, expired or invalid credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.tranqui.app/problems/unauthorized
            title: Unauthorized
            status: 401
            detail: Missing, expired or invalid credentials.
            code: UNAUTHORIZED
            instance: /v1/me
    TooManyRequests:
      description: Rate limit exceeded; wait for Retry-After seconds.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
            example: 60
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.tranqui.app/problems/rate-limited
            title: Too Many Requests
            status: 429
            detail: Too many requests; slow down and retry later.
            code: RATE_LIMITED
            instance: /v1/auth/otp/request

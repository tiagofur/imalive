# Spectral ruleset for the Tranqui contract (issue #2).
# Extends spectral:oas (OpenAPI 3.x rules, recommended set) with factory gates:
# unique operationIds, mandatory operationId, mandatory operation descriptions,
# examples validated against their schemas, RFC 9457 Problem error responses,
# and a privacy gate (`no-location-fields`) that fails CI if location data
# sneaks into the spec — in property names AND parameter names (issue #25).
extends: spectral:oas
rules:
  operation-operationId-unique: error
  # CJD-6 (issue #25): stack.md says the gate REQUIRES operationId — a
  # warning passes the lint (default fail-severity is error). Aligned.
  operation-operationId: error
  operation-description: error
  oas3-valid-media-example: error
  oas3-valid-schema-example: error
  no-location-fields:
    description: >
      Privacy gate (producto.md §H): no location data may be modelled in the
      contract. Given covers property names AND parameter names (CJD-3,
      issue #25: a query param named `lat` used to pass in silence).
    message: Name looks like a location field; location data must never be modelled in the contract (producto.md §H).
    severity: error
    given:
      - $..properties[*]~
      - $..parameters[*].name
    then:
      function: pattern
      functionOptions:
        notMatch: '/latitude|longitude|geo|location|lat(?![a-z])|lon(?![a-z])|lng(?![a-z])/i'
  error-responses-use-problem:
    description: 4xx/5xx (and default) responses must use the RFC 9457 Problem media type. `default` is covered too (CJD-5, issue #25).
    message: Error response must use application/problem+json with the Problem schema.
    severity: error
    given:
      - $.paths[*][*].responses['400','401','403','404','405','409','422','429'].content
      - $.paths[*][*].responses['500','502','503'].content
      - $.paths[*][*].responses['default'].content
      - $.components.responses[*].content
    then:
      field: application/problem+json
      function: truthy
  error-responses-use-problem-schema:
    # CJD-4 (issue #25): the media type alone passed an ad-hoc schema; the
    # payload must reference the shared Problem schema. resolved:false runs
    # the rule on the ORIGINAL document: Spectral dereferences $refs by
    # default, and a resolved node is the target itself (no $ref field), so
    # every shared-schema response would false-fail.
    description: The application/problem+json payload must reference the shared Problem schema.
    message: The problem+json payload must reference '#/components/schemas/Problem', not an ad-hoc schema.
    severity: error
    given:
      - $.paths[*][*].responses['400','401','403','404','405','409','422','429'].content['application/problem+json'].schema
      - $.paths[*][*].responses['500','502','503'].content['application/problem+json'].schema
      - $.paths[*][*].responses['default'].content['application/problem+json'].schema
      - $.components.responses[*].content['application/problem+json'].schema
    then:
      # An ad-hoc schema has no $ref at all: a pattern over a missing field
      # matches nothing (M4 escaped the first cut) — truthy first, then match.
    resolved: false
    then:
      - field: $ref
        function: truthy
      - field: $ref
        function: pattern
        functionOptions:
          match: '^#/components/schemas/Problem$'

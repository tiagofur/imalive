name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cada job se activa solo cuando existe el código de su stack (monorepo en F0).
# Los comandos definitivos viven en cada Makefile/proyecto (ver AGENTS.md).
jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('backend/go.mod') != '' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: make lint
      - run: make test

  android:
    name: Android
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/android/settings.gradle.kts') != '' }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew :app:lint testDebugUnitTest

  ios:
    name: iOS
    runs-on: macos-15
    if: ${{ hashFiles('apps/ios/*.xcodeproj/project.pbxproj') != '' }}
    steps:
      - uses: actions/checkout@v4
      # TODO(scaffolding iOS): ajustar scheme/destination definitivos
      - run: |
          xcodebuild test -scheme Tranqui \
            -destination 'platform=iOS Simulator,name=iPhone 16'
        working-directory: apps/ios

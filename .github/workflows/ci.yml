name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cada job se activa solo cuando existe el código de su stack (monorepo en F0).
# La detección vive en un job aparte porque hashFiles() no está permitido en el
# `if` de nivel de job: se calcula con shell y se expone como outputs.
# El job `ios` añade filtro de archivos cambiados: los minutos de macOS se
# facturan x10 en repos privados, así que solo corre si el PR/push toca
# apps/ios/** o los workflows. Los demás stacks quedan con el gate por
# existencia (ubuntu, barato).
# Los comandos definitivos viven en cada Makefile/proyecto (ver AGENTS.md).
jobs:
  detect:
    name: Detect stacks
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.stacks.outputs.backend }}
      android: ${{ steps.stacks.outputs.android }}
      ios: ${{ steps.stacks.outputs.ios }}
      contracts: ${{ steps.stacks.outputs.contracts }}
      ios_changed: ${{ steps.changes.outputs.ios_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # la detección de cambios compara contra la base
      - id: stacks
        run: |
          test -f backend/go.mod && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          test -f apps/android/settings.gradle.kts && echo "android=true" >> "$GITHUB_OUTPUT" || echo "android=false" >> "$GITHUB_OUTPUT"
          ls apps/ios/*.xcodeproj/project.pbxproj >/dev/null 2>&1 && echo "ios=true" >> "$GITHUB_OUTPUT" || echo "ios=false" >> "$GITHUB_OUTPUT"
          test -f contracts/openapi.yaml && echo "contracts=true" >> "$GITHUB_OUTPUT" || echo "contracts=false" >> "$GITHUB_OUTPUT"
      - id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          changed_all=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed="$(git diff --name-only "origin/$BASE_REF...$SHA")"
          elif git cat-file -e "$BEFORE" 2>/dev/null; then
            changed="$(git diff --name-only "$BEFORE" "$SHA")"
          else
            # Sin BEFORE alcanzable (force-push: el tip viejo desapareció, o
            # push inicial): un diff solo-tip ($SHA^..$SHA) se salta en
            # silencio los commits no-tip — sobre-disparar en su lugar
            # (issue #35: el coste macOS es preferible al job perdido).
            changed=""
            changed_all=true # primer commit o force-push: todo es nuevo
          fi
          ios_changed=false
          if [ "$changed_all" = "true" ] || printf '%s\n' "$changed" | grep -qE '^(apps/ios/|\.github/workflows/)'; then
            ios_changed=true
          fi
          echo "ios_changed=$ios_changed" >> "$GITHUB_OUTPUT"

  factory:
    name: Factory guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/factory_preflight.py
      - run: python3 -m unittest discover -s tests -p "test_*.py" -v

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: imalive
          POSTGRES_PASSWORD: imalive
          POSTGRES_DB: imalive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imalive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: local
      DATABASE_URL: postgres://imalive:imalive@localhost:5432/imalive?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      # Migrations cycle (issue #38): up -> down -> up -> version, mechanically
      # verified on every PR (down is a dev/CI tool; prod is forward-only).
      # CI runs the command directly: the service container replaces compose
      # and DATABASE_URL comes from the job env (make migrate-* is the dev path).
      - run: go run ./cmd/migrate up && go run ./cmd/migrate down && go run ./cmd/migrate up && go run ./cmd/migrate version
      - run: make lint
      - run: make test

  contracts:
    name: Contracts (OpenAPI)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.contracts == 'true'
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # make diff compares against origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # Spectral >= 22 required; see contracts/Makefile
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod # oasdiff via `go install`
      - run: make lint
      - run: make diff
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'contract-break') }}

  android:
    name: Android
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.android == 'true'
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew :app:lint testDebugUnitTest detekt ktlintCheck

  ios:
    name: iOS
    runs-on: macos-15
    needs: detect
    if: needs.detect.outputs.ios == 'true' && needs.detect.outputs.ios_changed == 'true'
    env:
      # Xcode pinneado (imagen macos-15); fallback documentado: 16.4 (default).
      # Bump = PR normal (docs/stack/ios.md).
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      # brew update refreshes the formula index so install takes the latest
      # stable (the runner's preinstalled swiftformat can lag the docs pin;
      # issue #35, run 41000286081). The docs pin (docs/stack/ios.md) is the
      # reference version; bumps land as PRs when the brew stable moves.
      - name: Install tooling (xcodegen, SwiftLint, SwiftFormat)
        run: brew update && brew install xcodegen swiftlint swiftformat
      - name: Ensure an iPhone 16 simulator exists (image drift guard)
        run: |
          if ! xcrun simctl list devices | grep -q "iPhone 16 ("; then
            xcrun simctl create "iPhone 16" \
              com.apple.CoreSimulator.SimDeviceType.iPhone-16 \
              com.apple.CoreSimulator.SimRuntime.iOS-26-2
          fi
          xcrun simctl list devices available | grep "iPhone 16 ("
      - name: SwiftLint (strict)
        run: swiftlint lint --strict --quiet
      - name: SwiftFormat (lint)
        run: swiftformat --lint .
      - name: Verify the generated project matches project.yml (drift check)
        run: |
          xcodegen generate
          git diff --exit-code
      - name: Build
        run: |
          xcodebuild build -scheme Tranqui \
            -destination 'platform=iOS Simulator,name=iPhone 16'
      - name: Test
        run: |
          xcodebuild test -scheme Tranqui \
            -destination 'platform=iOS Simulator,name=iPhone 16'

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cada job se activa solo cuando existe el código de su stack (monorepo en F0).
# La detección vive en un job aparte porque hashFiles() no está permitido en el
# `if` de nivel de job: se calcula con shell y se expone como outputs.
# Los comandos definitivos viven en cada Makefile/proyecto (ver AGENTS.md).
jobs:
  detect:
    name: Detect stacks
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.stacks.outputs.backend }}
      android: ${{ steps.stacks.outputs.android }}
      ios: ${{ steps.stacks.outputs.ios }}
      contracts: ${{ steps.stacks.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
      - id: stacks
        run: |
          test -f backend/go.mod && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          test -f apps/android/settings.gradle.kts && echo "android=true" >> "$GITHUB_OUTPUT" || echo "android=false" >> "$GITHUB_OUTPUT"
          ls apps/ios/*.xcodeproj/project.pbxproj >/dev/null 2>&1 && echo "ios=true" >> "$GITHUB_OUTPUT" || echo "ios=false" >> "$GITHUB_OUTPUT"
          test -f contracts/openapi.yaml && echo "contracts=true" >> "$GITHUB_OUTPUT" || echo "contracts=false" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: make lint
      - run: make test

  contracts:
    name: Contracts (OpenAPI)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.contracts == 'true'
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # make diff compares against origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # Spectral >= 22 required; see contracts/Makefile
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod # oasdiff via `go install`
      - run: make lint
      - run: make diff
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'contract-break') }}

  android:
    name: Android
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.android == 'true'
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew :app:lint testDebugUnitTest

  ios:
    name: iOS
    runs-on: macos-15
    needs: detect
    if: needs.detect.outputs.ios == 'true'
    steps:
      - uses: actions/checkout@v4
      # TODO(scaffolding iOS): ajustar scheme/destination definitivos
      - run: |
          xcodebuild test -scheme Tranqui \
            -destination 'platform=iOS Simulator,name=iPhone 16'
        working-directory: apps/ios

# Entorno local del backend (docs/arquitectura/overview.md §Entornos):
# solo Postgres y Redis como contenedores; la api corre en el host con
# `make run`. Sin secretos: credenciales locales de juguete, nunca las de
# entornos reales (esas viven en un gestor de secretos).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: imalive
      POSTGRES_PASSWORD: imalive
      POSTGRES_DB: imalive
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imalive -d imalive"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

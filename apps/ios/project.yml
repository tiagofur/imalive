# Source of truth for Tranqui.xcodeproj (generated, commited).
# Regenerate after any change here: `xcodegen generate` (see README.md).
name: Tranqui
options:
  bundleIdPrefix: com.imalive
  developmentLanguage: es # product copy language (ux-movil); en/pt added as structure
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0" # strict concurrency on by default (docs/stack/ios.md)
targets:
  Tranqui:
    type: application
    platform: iOS
    sources:
      - path: Tranqui
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imalive.tranqui
        TARGETED_DEVICE_FAMILY: "1" # phone-first product (docs/diseno/ux-movil.md)
        GENERATE_INFOPLIST_FILE: YES # F0: no permissions, nothing custom in the plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tranqui # the placeholder product name (#5): copy interpolates it — resolving #5 changes this one value
        SWIFT_EMIT_LOC_STRINGS: YES
  TranquiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Tranqui # hosted: Bundle.main is the app (TEST_HOST set by xcodegen)
  TranquiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Tranqui # TEST_TARGET_NAME set by xcodegen
schemes:
  Tranqui:
    build:
      targets:
        Tranqui: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TranquiTests
        - TranquiUITests

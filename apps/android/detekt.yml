# Detekt config (docs/stack/android.md): default rule set with build failures
# enabled. Compose conventions are taught to detekt (PascalCase composables);
# project-specific rules arrive when the codebase justifies them.
build:
  maxIssues: 0

config:
  validation: true

naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'

# Stateless Compose screens take the UI state plus one callback per
# interaction (the codebase's MVVM pattern); the parameter count is the
# pattern, not a smell.
complexity:
  LongParameterList:
    ignoreAnnotated:
      - 'Composable'
